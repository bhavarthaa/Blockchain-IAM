services:
  postgres:
    image: postgres:15-alpine
    container_name: blockchain-iam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blockchain_iam
    ports:
      - "5432:5432"
    volumes:
      - blockchain-iam-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blockchain_iam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blockchain-iam-postgres-data:
